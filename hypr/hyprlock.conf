general {
    ignore_empty_input = true
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

background {
    monitor =
    path = /no/path
    reload_cmd = cat ~/.config/matugen/generated/current_wallpaper
    reload_time = 1
    blur_passes = 3
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    position = 0, 350
    halign = center
    valign = center
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.70)
    font_size = 25
    font_family = SF Pro Display Bold
}

# Time
label {
    monitor =
    position = 0, 250
    halign = center
    valign = center
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(255, 255, 255, 0.70)
    font_size = 120
    font_family = SF Pro Display Bold
}

# Profile photo
image {
    monitor =
    position = 0, -20
    halign = center
    valign = center
    path = ~/.config/profile-photo.jpg
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1 
}

# User label
label {
    monitor =
    text =     $USER
    position = 0, 90
    halign = center
    valign = center
    color = rgba(255, 255, 255, 0.80)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 18
    font_family = SF Pro Display Bold
}

# Password input field
input-field {
    monitor =
    size = 300, 60
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i>󰌾  Enter your password...</i>
}
